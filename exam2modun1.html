<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function laSoHoanHao(num) {
        if (num <= 0) return false;

        let tong = 0;
        for (let i = 1; i < num; i++) {
          if (num % i === 0) {
            tong += i;
          }
        }
        return tong === num;
      }

      function cau2() {
        let n = parseInt(prompt("Nhập một số nguyên dương: "));

        if (isNaN(n) || n <= 0) {
          console.log("❌ Số nhập vào không hợp lệ!");
          return;
        }

        if (laSoHoanHao(n)) {
          console.log("✅ " + n + " là số hoàn hảo.");
        } else {
          console.log("❌ " + n + " không phải là số hoàn hảo.");
        }
      }

      cau2();
    </script>
  </body>
</html>
